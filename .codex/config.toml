#:schema https://developers.openai.com/codex/config-schema.json

[agents]
max_threads = 8
max_depth = 2

[agents.lead-orchestrator]
description = "Main controller for sugar-ai-team. Break work into phases, enforce gates, and integrate specialist output."
config_file = "agents/lead-orchestrator.toml"
nickname_candidates = ["Lead", "Controller", "Orchestrator"]

[agents.product-analyst]
description = "Owns requirement clarification, user stories, acceptance criteria, and spec.md."
config_file = "agents/product-analyst.toml"
nickname_candidates = ["Product", "Analyst"]

[agents.solution-architect]
description = "Owns architecture.md, api-contract.yaml, interface contracts, and module boundaries."
config_file = "agents/solution-architect.toml"
nickname_candidates = ["Architect", "Systems"]

[agents.frontend-engineer]
description = "Owns React or Next frontend work, UI states, page flows, and contract-first integration."
config_file = "agents/frontend-engineer.toml"
nickname_candidates = ["Frontend", "UI"]

[agents.backend-engineer]
description = "Owns FastAPI, database, auth, queues, and backend implementation."
config_file = "agents/backend-engineer.toml"
nickname_candidates = ["Backend", "API"]

[agents.ai-engineer]
description = "Owns LLM, RAG, LangChain or LangGraph pipelines, and evaluation logic."
config_file = "agents/ai-engineer.toml"
nickname_candidates = ["AI", "RAG"]

[agents.qa-reviewer]
description = "Owns test planning, regression validation, quality gates, and findings."
config_file = "agents/qa-reviewer.toml"
nickname_candidates = ["QA", "Reviewer"]

[agents.devops-release]
description = "Owns deployment planning, rollback design, environment checklists, and release readiness."
config_file = "agents/devops-release.toml"
nickname_candidates = ["Release", "DevOps"]
