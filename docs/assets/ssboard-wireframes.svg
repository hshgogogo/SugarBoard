<svg width="1800" height="1220" viewBox="0 0 1800 1220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="1220" rx="24" fill="#0F1115"/>
  <text x="50" y="60" fill="#F3F5F7" font-size="32" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">SSBoard 页面原型图</text>
  <text x="50" y="95" fill="#AAB1BF" font-size="16" font-family="PingFang SC, Microsoft YaHei, sans-serif">首页总览、榜单页、实体详情页、AI 查询工作台</text>

  <defs>
    <style>
      .t{font-family:PingFang SC, Microsoft YaHei, sans-serif}
      .title{fill:#F3F5F7;font-size:22px;font-weight:700}
      .label{fill:#AAB1BF;font-size:13px}
      .card{fill:#121720;stroke:rgba(255,255,255,.16)}
      .dash{fill:none;stroke:rgba(255,255,255,.22);stroke-dasharray:7 6}
      .pill{fill:#2A2113}
      .gold{fill:#D7B46A}
    </style>
  </defs>

  <g transform="translate(50 130)">
    <rect width="820" height="500" rx="22" class="card"/>
    <text x="24" y="34" class="t title">首页总览</text>
    <rect x="655" y="16" width="140" height="34" rx="17" class="pill"/><text x="686" y="38" class="t" fill="#D7B46A" font-size="12">Home Dashboard</text>
    <rect x="20" y="66" width="120" height="48" rx="14" class="dash"/><text x="38" y="95" class="t label">Logo / 产品名</text>
    <rect x="154" y="66" width="420" height="48" rx="14" class="dash"/><text x="178" y="95" class="t label">搜索 / 时间 / 来源 / 平台 / 题材</text>
    <rect x="590" y="66" width="210" height="48" rx="14" class="dash"/><text x="615" y="95" class="t label">最近任务 / 快捷入口</text>

    <rect x="20" y="132" width="182" height="80" rx="16" class="dash"/><text x="40" y="164" class="t label">KPI 01 在榜作品数</text>
    <rect x="216" y="132" width="182" height="80" rx="16" class="dash"/><text x="236" y="164" class="t label">KPI 02 上新作品数</text>
    <rect x="412" y="132" width="182" height="80" rx="16" class="dash"/><text x="432" y="164" class="t label">KPI 03 热度涨幅冠军</text>
    <rect x="608" y="132" width="192" height="80" rx="16" class="dash"/><text x="628" y="164" class="t label">KPI 04 数据覆盖率</text>

    <rect x="20" y="228" width="380" height="108" rx="16" class="dash"/><text x="40" y="258" class="t label">艺人热榜</text>
    <rect x="420" y="228" width="380" height="108" rx="16" class="dash"/><text x="440" y="258" class="t label">角色热榜</text>
    <rect x="20" y="350" width="380" height="108" rx="16" class="dash"/><text x="40" y="380" class="t label">剧集热榜</text>
    <rect x="420" y="350" width="380" height="108" rx="16" class="dash"/><text x="440" y="380" class="t label">电影热榜</text>

    <rect x="20" y="474" width="500" height="16" rx="8" fill="rgba(255,255,255,.08)"/>
    <rect x="20" y="474" width="660" height="0"/>
    <rect x="540" y="228" width="0" height="0"/>
  </g>

  <g transform="translate(930 130)">
    <rect width="820" height="500" rx="22" class="card"/>
    <text x="24" y="34" class="t title">榜单页</text>
    <rect x="700" y="16" width="92" height="34" rx="17" class="pill"/><text x="722" y="38" class="t" fill="#D7B46A" font-size="12">Ranking</text>
    <rect x="20" y="66" width="180" height="396" rx="16" class="dash"/><text x="44" y="98" class="t label">筛选栏：时间 / 来源 / 平台 / 题材 / 排序</text>
    <rect x="220" y="66" width="390" height="396" rx="16" class="dash"/><text x="244" y="98" class="t label">榜单主表：排名 / 名称 / 分值 / 涨跌</text>
    <rect x="630" y="66" width="170" height="396" rx="16" class="dash"/><text x="652" y="98" class="t label">右侧分析：趋势 / 来源拆解</text>
  </g>

  <g transform="translate(50 670)">
    <rect width="820" height="500" rx="22" class="card"/>
    <text x="24" y="34" class="t title">实体详情页</text>
    <rect x="665" y="16" width="130" height="34" rx="17" class="pill"/><text x="695" y="38" class="t" fill="#D7B46A" font-size="12">Entity Detail</text>
    <rect x="20" y="66" width="250" height="396" rx="16" class="dash"/><text x="42" y="98" class="t label">基础信息：海报 / 标签 / 平台 / 更新时间</text>
    <rect x="290" y="66" width="510" height="120" rx="16" class="dash"/><text x="314" y="98" class="t label">热度趋势 / 榜单轨迹 / 指标卡</text>
    <rect x="290" y="202" width="300" height="260" rx="16" class="dash"/><text x="314" y="234" class="t label">关联关系：演员阵容 / 角色关系 / 合作网络</text>
    <rect x="610" y="202" width="190" height="260" rx="16" class="dash"/><text x="630" y="234" class="t label">事件时间线</text>
  </g>

  <g transform="translate(930 670)">
    <rect width="820" height="500" rx="22" class="card"/>
    <text x="24" y="34" class="t title">AI 查询工作台</text>
    <rect x="665" y="16" width="130" height="34" rx="17" class="pill"/><text x="693" y="38" class="t" fill="#D7B46A" font-size="12">AI Analytics</text>
    <rect x="20" y="66" width="250" height="396" rx="16" class="dash"/><text x="42" y="98" class="t label">问题输入 / 推荐问题 / 任务列表</text>
    <rect x="290" y="66" width="510" height="110" rx="16" class="dash"/><text x="314" y="98" class="t label">执行逻辑：意图识别 / SQL / 风险等级 / 数据范围</text>
    <rect x="290" y="192" width="320" height="270" rx="16" class="dash"/><text x="314" y="224" class="t label">结果图表区</text>
    <rect x="630" y="192" width="170" height="270" rx="16" class="dash"/><text x="650" y="224" class="t label">分析摘要区</text>
  </g>
</svg>
